# Re：哔哩下载姬 —— Gradle 全局配置
#
# 工程路径必须保持纯 ASCII：AGP 遇到非 ASCII 路径会直接报错。
# 当前工程位于 d:/67262/Documents/ReDownKyi，符合要求。

# JVM 参数：
# - preferIPv4Stack 是原项目实测结论 —— 走 IPv6 拉依赖极易超时
# - file.encoding=UTF-8 保证 Windows 下中文资源文件读取正确
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# AndroidX 与资源处理
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

kotlin.code.style=official
